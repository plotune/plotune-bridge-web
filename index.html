<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F6F2" />
    <meta name="color-scheme" content="light" />
    <!-- GitHub Pages cannot set headers. connect-src must allow ws:/wss: to a device on a private network the page cannot know in advance.
         The two https hosts are the optional cloud sign-in (account API) and Stream project/pairing calls; no other https origin is allowed. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss: https://api.plotune.net https://stream.plotune.net; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <link rel="icon" href="./favicon.ico" />
    <title>Plotune Bridge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
